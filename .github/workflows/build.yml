name: Build Geode Mod

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Build Mod
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build . --config Release
